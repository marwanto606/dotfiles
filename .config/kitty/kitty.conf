# ==========================================
# 1. PENGATURAN KURSOR
# ==========================================
cursor_trail 1
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# Bentuk kursor (block, beam, atau underline)
cursor_shape beam
cursor_blink_interval 0.5

# ==========================================
# 2. FONT & LIGATURE
# ==========================================
# Ganti dengan font favoritmu
font_family      Maple mono NF 
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12

# Mengaktifkan ligatures
disable_ligatures never

# ==========================================
# 3. TAMPILAN JENDELA & BACKGROUND (Transparansi)
# ==========================================
# Efek kaca transparan (0.0 sampai 1.0)
background_opacity 0.80
background_blur 0

# Memberikan jarak (margin) agar teks tidak menempel ke tepi layar
window_padding_width 0

# Menghilangkan title bar bawaan sistem agar terlihat minimalis dan bersih
hide_window_decorations yes

# ==========================================
# 4. TAMPILAN TAB (Tema Cyberpunk - Nyaman di Mata)
# ==========================================
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted

# Tab Aktif: Cyan/Teal kalem dengan teks biru gelap
active_tab_foreground   #0f1322
active_tab_background   #2894a8
active_tab_font_style   bold

# Tab Tidak Aktif: Gelap dengan teks Fuchsia redup
inactive_tab_foreground #8a2a59
inactive_tab_background #131726

# ==========================================
# 5. TEMA WARNA: MUTED CYBERPUNK TEAL & FUCHSIA
# ==========================================
# Latar Belakang: Biru malam gelap (Biru *slate* yang tidak sepekat hitam, agar tidak silau)
background #0b0e17
# Teks Default: Abu-abu kebiruan pucat (bukan putih murni, sangat lembut di mata)
foreground #a6b8b8

# Warna Blok Seleksi (Saat teks di-blok)
selection_background #8a2a7a
selection_foreground #e0e0e0

# Kursor: Fuchsia Kalem (Tetap kontras tapi tidak menusuk mata)
cursor #c9347c
cursor_text_color #c9347c

# ------------------------------------------
# PALET WARNA ANSI (CYBERPUNK KALEM / EYE-FRIENDLY)
# ------------------------------------------

# Black (Abu-abu kebiruan)
color0 #171b2d
color8 #384061

# Red (Cyber Red - Merah Pink/Fuchsia redup)
color1 #d9415f
color9 #e65e7a

# Green (Teal-Green / Mint pastel)
color2  #1fa882
color10 #3bcca4

# Yellow (Kuning emas pudar - agar peringatan tidak menyilaukan)
color3  #c2af2d
color11 #dbca4d

# Blue / Muted Cyan (PENTING: Warna folder 'ls')
# Diubah jadi warna laut dalam/Teal yang tetap jelas terbaca tapi kalem
color4  #2894a8
color12 #43b5c9

# Magenta / Fuchsia (Ungu pastel)
color5  #a83abf
color13 #c259d6

# Cyan / Teal (Aksen cyan yang lebih hangat)
color6  #20b59f
color14 #45c4b1

# White (Abu-abu terang kebiruan)
color7  #a0a8b3
color15 #c1c8d1

# ==========================================
# 6. LAIN-LAIN
# ==========================================
# Mematikan suara bel terminal yang mengganggu
enable_audio_bell no
visual_bell_duration 0.0

window_alert_on_bell no
remember_window_size yes

# Scrollback (Seberapa panjang kamu bisa scroll ke atas)
scrollback_lines 10000
