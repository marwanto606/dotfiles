# Backend rendering (glx disarankan agar lebih halus di GPU/laptop)
backend = "glx";
vsync = true;

# Nilai lengkungan sudut
corner-radius = 10;

# Pengecualian sudut lengkung (Fullscreen, Bar, dan Mode Monocle)
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_NET_WM_STATE *= '_NET_WM_STATE_FULLSCREEN'",
  "_PICOM_ROUNDED = 1",
  "_PICOM_ROUNDED@ = 1"
];

# ================= STATUS FOKUS =================
mark-wmwin-focused = true;
mark-ovredir-focused = true;
use-ewmh-active-win = true;
detect-client-opacity = true;

# ================= OPACITY / TRANSPARANSI =================
active-opacity = 1.0;
inactive-opacity = 0.80;
inactive-opacity-override = false;

focus-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Polybar'",
  "class_g = 'Rofi'",
  "class_g = 'Chromium'",
  "class_g = 'firefox'"
];

# Transisi transparan halus
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 5;

# ==============================================================
#                 ANIMASI (Khusus Picom v12 / v13)
# ==============================================================
# DAFTAR PRESET ANIMASI YANG TERSEDIA (Ganti di bagian "preset"):
# 1. "zoom"       -> Membesar/mengecil dari tengah (sangat keren & mulus ala macOS/Win11)
# 2. "fly-in"     -> Terbang melayang masuk dari arah tertentu 
# 3. "fly-out"    -> Terbang melayang keluar
# 4. "slide-in"   -> Bergeser masuk secara datar
# 5. "slide-out"  -> Bergeser keluar secara datar
# 6. "appear"     -> Muncul dengan efek opacity (tanpa pergerakan)
# 7. "disappear"  -> Menghilang dengan efek opacity
# 
# DAFTAR ARAH (Khusus jika pakai preset fly/slide, isi di "direction"):
# "up", "down", "left", "right"
# ==============================================================

animations = (
  # 1. Animasi saat Jendela DIBUKA atau saat PINDAH WORKSPACE (Masuk)
  {
    triggers = [ "open", "show" ];
    preset = "slide-in";      # <--- Ubah efek di sini (Contoh: "zoom", "slide-in")
    direction = "up";       # <--- Ubah arah di sini (Opsional untuk zoom)
    duration = 0.15;        # <--- Waktu animasi (0.15 sangat cepat & snappy, 0.2 sedikit lebih lambat)
  },
  
  # 2. Animasi saat Jendela DITUTUP atau saat PINDAH WORKSPACE (Keluar)
  {
    triggers = [ "close", "hide" ];
    preset = "slide-out";     # <--- Ubah efek di sini
    direction = "down";       
    duration = 0.15;
  },

  # 3. Animasi saat Jendela BERUBAH UKURAN (Resize) atau PINDAH POSISI (Move)
  {
    triggers = [ "geometry" ];
    preset = "geometry-change";
    duration = 0.15;
  }
)