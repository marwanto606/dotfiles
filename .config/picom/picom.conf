# ================= RENDERING & BACKEND =================
backend = "glx";
vsync = true;
use-damage = false; 
xrender-sync-fence = true;

# Nilai lengkungan sudut bawaan (default)
corner-radius = 10;

# UBAH INI KE TRUE agar Picom mengenali sudut lengkung bawaan GTK (mencegah sudut hitam)
detect-rounded-corners = true;
detect-client-opacity = true;

# ================= STATUS FOKUS =================
use-ewmh-active-win = true;

# ================= FADING =================
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;

# ================= BLUR (FROSTED GLASS) =================
blur: {
  method = "dual_kawase";
  strength = 3;
  background = false;
  background-frame = false;
  background-fixed = false;
};


# ==============================================================
#                 RULES (Aturan Modern Picom v12/v13)
# ==============================================================
rules = (
  # 1. Aturan Transparansi Global
  {
    match = "!focused";
    opacity = 0.80;
    blur-background = false;
  },
  {
    match = "focused";
    opacity = 0.90;
    blur-background = true;
  },

  # 2. Pengecualian Transparansi (Solid)
  {
    match = "window_type = 'dock' || "
            "window_type = 'desktop' || "
            "window_type = 'menu' || "           # Menu aplikasi
            "window_type = 'dropdown_menu' || "  # Menu dropdown (cth: klik baris menu)
            "window_type = 'popup_menu' || "     # Context menu (cth: klik kanan)
            "window_type = 'tooltip' || "        # Tooltip teks saat kursor diarahkan
            "window_type = 'utility' || "        # Jendela utilitas/toolbox kecil
            "window_type = 'combo' || "
            "class_g = 'Polybar' || "
            "class_g = 'Rofi' || "
            "class_g = 'i3lock' || " 
            "class_g = 'GLava'";
    opacity = 1.0;
    fade = false;
    corner-radius = 0;
  }, 
  {
    match = "window_type = 'tooltip'";
    corner-radius = 10;
    blur-background = false;
  },
  
  # 3. Aturan Khusus AIMP
  {
    match = "class_g = 'Aimp' || class_g = 'aimp' || class_i = 'aimp'";
    corner-radius = 10;
  },

  # 4. Sudut 0 untuk FULLSCREEN, DOCK & DESKTOP
  {
    match = "fullscreen || "
            "window_type = 'dock' || "
            "window_type = 'desktop'";
    corner-radius = 0; 
  }
);

# ==============================================================
#                 ANIMASI (Khusus Picom v12 / v13)
# ==============================================================
animations = (
  # 1. Animasi saat Jendela DIBUKA / TAMPIL (Masuk)
  {
    triggers = [ "open", "show" ];
    preset = "slide-in";
    direction = "up";
    duration = 0.15;
  },
  
  # 2. Animasi saat Jendela DITUTUP / TERSEMBUNYI (Keluar)
  {
    triggers = [ "close", "hide" ];
    preset = "slide-out"; 
    direction = "down";       
    duration = 0.15;
  },

  # 3. Animasi saat Jendela RESIZE atau MOVE
  {
    triggers = [ "geometry" ];
    preset = "geometry-change";
    duration = 0.15;
  }
);