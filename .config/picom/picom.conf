# ================= RENDERING & BACKEND =================
backend = "glx";
vsync = true;
use-damage = false; 
xrender-sync-fence = true;

# Nilai lengkungan sudut bawaan (default)
corner-radius = 10;
detect-rounded-corners = true;

# ================= STATUS FOKUS =================
use-ewmh-active-win = true;

# ================= FADING =================
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;

# ==============================================================
#                 RULES (Aturan Modern Picom v12/v13)
# ==============================================================
rules = (
  # 1. Aturan Transparansi Global
  {
    match = "!focused";
    opacity = 0.80;
  },
  {
    match = "focused";
    opacity = 1.0;
  },

  # 2. Pengecualian Transparansi (Solid)
  {
    match = "window_type = 'dock' || "
            "window_type = 'desktop' || "
            "class_g = 'Polybar' || "
            "class_g = 'Rofi' || "
            "class_g = 'Chromium' || "
            "class_g = 'firefox' || "
            "class_g = 'GLava'";
    opacity = 1.0;
    fade = false;
  },

  # 3. Aturan Khusus AIMP
  {
    match = "class_g = 'Aimp' || class_g = 'aimp' || class_i = 'aimp'";
    corner-radius = 10;
  },

  # 4. Sudut 0 untuk FULLSCREEN, MONOCLE BSPWM, DOCK & DESKTOP
  {
    match = "fullscreen || "
            "_PICOM_ROUNDED:32c = 1 || "
            "_PICOM_ROUNDED@:32c = 1 || "
            "_PICOM_ROUNDED = 1 || "
            "window_type = 'dock' || "
            "window_type = 'desktop'";
    corner-radius = 0;
  }
);

# ==============================================================
#                 ANIMASI (Khusus Picom v12 / v13)
# ==============================================================
animations = (
  # 1. Animasi saat Jendela DIBUKA / TAMPIL (Masuk)
  {
    triggers = [ "open", "show" ];
    preset = "slide-in";
    direction = "up";
    duration = 0.15;
  },
  
  # 2. Animasi saat Jendela DITUTUP / TERSEMBUNYI (Keluar)
  {
    triggers = [ "close", "hide" ];
    preset = "slide-out"; 
    direction = "down";       
    duration = 0.15;
  },

  # 3. Animasi saat Jendela RESIZE atau MOVE
  {
    triggers = [ "geometry" ];
    preset = "geometry-change";
    duration = 0.15;
  }
);