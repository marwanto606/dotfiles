# ================= RENDERING & BACKEND =================
backend = "glx";
vsync = true;
use-damage = true; 
xrender-sync-fence = true;

# Nilai lengkungan sudut bawaan (default)
corner-radius = 10;

# UBAH INI KE TRUE agar Picom mengenali sudut lengkung bawaan GTK (mencegah sudut hitam)
detect-rounded-corners = true;
detect-client-opacity = true;

# ================= STATUS FOKUS =================
use-ewmh-active-win = true;

# ================= FADING =================
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;

# ================= BLUR (FROSTED GLASS) =================
blur: {
  method = "dual_kawase";
  strength = 3;
  background = false;
  background-frame = false;
  background-fixed = false;
};


# ==============================================================
#                 RULES (Aturan Modern Picom v12/v13)
# ==============================================================
rules = (
  # 1. Aturan Transparansi Global
  {
    match = "!focused";
    opacity = 0.80;
    blur-background = false;
  },
  {
    match = "focused";
    opacity = 0.90;
    blur-background = true;
  },

  # 2. Pengecualian Transparansi (Solid)
  # Catatan: 'dock' dikecualikan khusus untuk Polybar
  {
    match = "(window_type = 'dock' && class_g != 'Polybar') || "
            "window_type = 'desktop' || "
            "window_type = 'menu' || "
            "window_type = 'dropdown_menu' || "
            "window_type = 'popup_menu' || "
            "window_type = 'tooltip' || "
            "window_type = 'utility' || "
            "window_type = 'combo' || "
            "class_g = 'Rofi' || "
            "class_g = 'i3lock' || " 
            "class_g = 'GLava'";
    opacity = 1.0;
    fade = false;
    corner-radius = 0;
  },

  {
    match = "window_type = 'tooltip'";
    corner-radius = 10;
    blur-background = false;
  },
  
  # 3. Aturan Khusus AIMP
  {
    match = "class_g = 'Aimp' || class_g = 'aimp' || class_i = 'aimp'";
    corner-radius = 10;
  },

  # 4. Sudut 0 untuk FULLSCREEN, DOCK (Selain Polybar), & DESKTOP
  {
    match = "fullscreen || "
            "(window_type = 'dock' && class_g != 'Polybar') || "
            "window_type = 'desktop'";
    corner-radius = 0; 
    opacity = 1.0;
  },

  # monocle mode rule
  {
    match = "_BSPWM_MONOCLE@:c = 1";
    corner-radius = 0;
  },

  # 5. ATURAN KHUSUS POLYBAR (Ditaruh paling bawah agar prioritas tertinggi)
  { 
    match = "class_g = 'Polybar'";
    corner-radius = 10;
    fade = false;
    opacity = 0.90;
  }
);

# ==============================================================
#                 ANIMASI (Khusus Picom v12 / v13)
# ==============================================================
animations = (
  # 1. BUKA / SHOW: Meluncur TURUN dari atas secara mulus & kencang
  {
    triggers = [ "open", "show" ];
    offset-y = {
      # Kurva eksponensial (cepat di awal, mendarat dengan sangat lembut)
      curve = "cubic-bezier(0.16, 1, 0.3, 1)";
      duration = 0.13;       # Singkat dan responsif
      start = -40;           # Mulai dari 40px di ATAS posisi aslinya (turun ke bawah)
      end = 0;               # Tepat di posisi asli
    };
    opacity = {
      curve = "cubic-bezier(0.16, 1, 0.3, 1)";
      duration = 0.13;
      start = 0.0;
      end = "window-raw-opacity";
    };
  },
  
  # 2. TUTUP / HIDE: Meluncur TURUN ke bawah lalu lenyap secara instan-halus
  {
    triggers = [ "close", "hide" ];
    offset-y = {
      # Kurva akselerasi (mulai santai lalu meluncur cepat ke bawah)
      curve = "cubic-bezier(0.4, 0, 1, 1)";
      duration = 0.11;       # Animasi tutup dibuat sedikit lebih cepat agar terasa reaktif
      start = 0;
      end = 40;              # Meluncur turun sejauh 40px
    };
    opacity = {
      curve = "linear";
      duration = 0.11;
      start = "window-raw-opacity-before";
      end = 0.0;
    };
  },

  # 3. GEOMETRY: Resize & Pindah workspace tanpa jeda kasar
  {
    triggers = [ "geometry" ];
    preset = "geometry-change";
    duration = 0.13;
  }
);