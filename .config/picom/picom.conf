# Backend rendering (glx disarankan agar lebih halus di GPU/laptop)
backend = "glx";
vsync = true;

# Nilai lengkungan sudut
corner-radius = 10;

# Pengecualian sudut lengkung (Fullscreen, Bar, dan Mode Monocle)
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_NET_WM_STATE *= '_NET_WM_STATE_FULLSCREEN'",
  "_PICOM_ROUNDED = 1",
  "_PICOM_ROUNDED@ = 1"
];

# ================= STATUS FOKUS =================
mark-wmwin-focused = true;
mark-ovredir-focused = true;
use-ewmh-active-win = true;
detect-client-opacity = true;

# ================= OPACITY / TRANSPARANSI =================
active-opacity = 1.0;
inactive-opacity = 0.80;
inactive-opacity-override = false;

focus-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Polybar'",
  "class_g = 'Rofi'",
  "class_g = 'Chromium'",
  "class_g = 'firefox'"
];

# Transisi transparan halus
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 5;