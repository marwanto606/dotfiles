;==========================================================
;   POLYBAR - NORDIC CYBER-BENTO (SOFT TEAL & VELVET FUCHSIA)
;==========================================================

[colors]
; Background Pseudo-Transparent (Deep Glass Navy ~78% Opacity)
background       = #C80D1117
background-alt   = #161E2E

; Teks & Kontras
foreground       = #E6EDF3
foreground-alt   = #8B949E
disabled         = #484F58

; Palet Teal & Fuchsia Lebih Lembut (Soft & Eye-Pleasing)
teal             = #008080
teal-soft        = #5EEAD4
fuchsia          = #D946EF
fuchsia-soft     = #E879F9

; Border aksen kaca
border-color     = #2B3849

[bar/main]
monitor = ${env:MONITOR:}
bottom = true

; Ukuran & Posisi Floating
width = 98%
height = 28pt
offset-x = 1%
offset-y = 5px
radius = 10

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt

; Border halus semi-transparan
border-size = 0pt
border-color = ${colors.border-color}

padding-left = 0
padding-right = 0
module-margin = 0

; Separator pemisah tipis dan bersih antar modul
;separator = "%{F#30363D}│%{F-}"
separator = ""

; ================= FONTS =================
font-0 = "JetBrains Mono:weight=medium:pixelsize=9;3"
font-1 = "Symbols Nerd Font:style=Regular:pixelsize=11;3"
font-2 = "Symbols Nerd Font:style=Regular:pixelsize=18;4"

; ================= TATA LETAK =================
modules-left = launcher bspwm aimp xwindow
modules-right = network cpu memory pulseaudio mic battery systray mprisence date powermenu

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true
wm-restack = bspwm
override-redirect = true


; ==========================================================
; TOMBOL KIRI (LAUNCHER)
; ==========================================================
[module/launcher]
type = custom/text
format = ""
format-font = 2
format-foreground = ${colors.foreground}
format-padding = 15px
click-left = "rofi -show drun -theme-str 'inputbar { children: [ icon-search, entry ]; }' > /dev/null 2>&1 &"

; ==========================================================
; WORKSPACE BSPWM (MINIMAL CAPSULE DOTS)
; ==========================================================
[module/bspwm]
type = internal/bspwm

label-focused = "󰮯"
label-focused-foreground = ${colors.foreground}
label-focused-background = ${colors.background}
label-focused-padding = 5px

label-occupied = ""
label-occupied-foreground = ${colors.foreground}
label-occupied-background = ${colors.background}
label-occupied-padding = 6px

label-empty = "󰝦"
label-empty-foreground = ${colors.disabled}
label-empty-background = ${colors.background}
label-empty-padding = 5px

; ==========================================================
; AIMP PLAYER (ICON DIHAPUS, MURNI DARI SCRIPT)
; ==========================================================
[module/aimp]
type = custom/script
exec = ~/.config/polybar/scripts/aimp.sh
interval = 1

format = <label>
format-background = ${colors.background}
format-padding = 1
click-right = aimp &

; ==========================================================
; JUDUL APLIKASI (DIBATASI PANJANGNYA AGAR BAR KANAN AMAN)
; ==========================================================
[module/xwindow]
type = internal/xwindow

; Dibatasi max 20 karakter agar modul kanan tidak terdorong keluar layar
label = " %title:0:20:...% "
label-empty = ""
label-foreground = ${colors.foreground-alt}

; ==========================================================
; NETWORK STATS
; ==========================================================
[module/network]
type = internal/network
interface = wlan0
interval = 1.0

; Format ringkas dengan panah minimalis
label-connected = "%{A1:~/.config/rofi/vnstat.sh:}%{F#20B2AA}󰛀 %{F#E6EDF3}%downspeed:5%%{F-} %{F#C75B9B}󰛃 %{F#E6EDF3}%upspeed:5%%{F-}%{A}"
format-connected-padding = 1
format-disconnected =

; ==========================================================
; CPU & RAM MONITOR
; ==========================================================
[module/cpu]
type = internal/cpu
interval = 2

format = %{A1:~/.config/rofi/process-manager.sh:}<label>%{A}
format-prefix = "󰍛 "
format-prefix-foreground = ${colors.foreground}
label = "%percentage:2%%"
label-foreground = ${colors.foreground}
format-padding = 1

[module/memory]
type = internal/memory
interval = 2

format = %{A1:~/.config/rofi/process-manager.sh:}<label>%{A}
format-prefix = "󰘚 "
format-prefix-foreground = ${colors.foreground}
label = "%percentage_used:2%%"
label-foreground = ${colors.foreground}
format-padding = 1

; ==========================================================
; AUDIO: PULSEAUDIO & MIC
; ==========================================================
[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false

format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
label-volume-foreground = ${colors.foreground}

ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-3 = 
ramp-volume-foreground = ${colors.foreground}

format-muted = <label-muted>
label-muted = ""
label-muted-foreground = ${colors.fuchsia-soft}

format-volume-padding = 1
format-muted-padding = 1

click-left = pactl set-sink-mute @DEFAULT_SINK@ toggle
click-right = ~/.config/bspwm/scripts/pavucontrol.sh speaker

[module/mic]
type = custom/script
exec = sh -c 'if pactl get-source-mute @DEFAULT_SOURCE@ | grep -q "yes"; then echo "%{F#E6EDF3}%{F-}"; else vol=$(pactl get-source-volume @DEFAULT_SOURCE@ | grep -o "[0-9]*%" | head -n 1); echo "%{F#E6EDF3}%{F-} $vol"; fi'
interval = 1

format = <label>
label = %output%
format-padding = 1

scroll-up = sh -c 'pactl set-source-volume @DEFAULT_SOURCE@ +5%; v=$(pactl get-source-volume @DEFAULT_SOURCE@ | grep -o "[0-9]*%" | head -n 1 | tr -d "%"); [ "$v" -gt 100 ] && pactl set-source-volume @DEFAULT_SOURCE@ 100%'
scroll-down = pactl set-source-volume @DEFAULT_SOURCE@ -5%
click-left = pactl set-source-mute @DEFAULT_SOURCE@ toggle
click-right = ~/.config/bspwm/scripts/pavucontrol.sh mic

; ==========================================================
; BATTERY
; ==========================================================
[module/battery]
type = internal/battery
poll-interval = 2 
battery = BAT0
adapter = AC 
full-at = 98 
low-at = 20

format-full = <label-full>
format-full-prefix = "󰂅 "
format-full-prefix-foreground = ${colors.foreground}
label-full = "%percentage%%"
format-full-padding = 1

format-charging = <animation-charging> <label-charging>
label-charging = "%percentage%%"
animation-charging-0 = "󰂆"
animation-charging-1 = "󰂈"
animation-charging-2 = "󰂉"
animation-charging-3 = "󰂊"
animation-charging-4 = "󰂅"
animation-charging-foreground = ${colors.foreground}
animation-charging-framerate = 750
format-charging-padding = 1

format-discharging = <ramp-capacity> <label-discharging>
label-discharging = "%percentage%%"
ramp-capacity-0 = "󰁺"
ramp-capacity-1 = "󰁼"
ramp-capacity-2 = "󰁾"
ramp-capacity-3 = "󰂀"
ramp-capacity-4 = "󰁹"
ramp-capacity-foreground = ${colors.fuchsia-soft}
format-discharging-padding = 1

format-low = <animation-low> <label-low>
label-low = "%percentage%%!"
label-low-foreground = ${colors.foreground}
animation-low-0 = "󰂃"
animation-low-1 = "󰀦"
animation-low-foreground = ${colors.fuchsia-soft}
animation-low-framerate = 400
format-low-padding = 1

format-unknown = <label-unknown>
format-unknown-prefix = "󰂑 "
format-unknown-prefix-foreground = ${colors.fuchsia-soft}
label-unknown = "%percentage%%"
format-unknown-padding = 1

; ==========================================================
; SYSTEM TRAY
; ==========================================================
[module/systray]
type = internal/tray
format-margin = 0px
tray-spacing = 5px
tray-size = 40%
tray-background = ${colors.background}

; ==========================================================
; MPRISENCE
; ==========================================================
[module/mprisence]
type = custom/script
exec = ~/.config/mprisence/mprisence.sh
interval = 2
click-left = ~/.config/mprisence/mprisence.sh --toggle
click-right = notify-send -r 9991 -t 2000 -u low -i multimedia-audio-player "MPRISence Discord" "Click to toggle ON/OFF"
cursor-click = pointer
format-padding = 1

; ==========================================================
; JAM & TANGGAL (COMPACT DATE SUPAYA TIDAK OVERFLOW)
; ==========================================================
[module/date]
type = internal/date
interval = 1

; Tampilan reguler
date = %H:%M

; Tampilan saat di klik kiri (Dibuat ringkas agar bar kanan tidak hilang)
date-alt = %a, %d %b • %H:%M

format = <label>
;format-prefix = "󰥔 "
;format-prefix-foreground = ${colors.teal}
label = "%{A3:~/.config/bspwm/scripts/gsimplecal.sh:}%date%%{A}"
label-foreground = ${colors.foreground}
format-padding = 1

; ==========================================================
; TOMBOL KANAN (POWERMENU)
; ==========================================================
[module/powermenu]
type = custom/text
format = ""
format-font = 2
format-background = ${colors.background}
format-foreground = ${colors.foreground}
format-padding = 15px
click-left = ~/.config/rofi/powermenu.sh

; ==========================================================
; SETTINGS
; ==========================================================
[settings]
screenchange-reload = true
pseudo-transparency = true