;==========================================================
;   POLYBAR - TEAL & FUCHSIA FLOATING THEME
;==========================================================

[colors]
background = #0F111A
background-alt = #1A1D2D
foreground = #FFFFFF
foreground-alt = #94A3B8

; Palet Teal & Fuchsia
teal = #008080
fuchsia = #D946EF
purple = #A855F7
disabled = #475569

[bar/main]
monitor = ${env:MONITOR:}
bottom = true

; Ukuran dan jarak mengambang (Floating margin)
width = 98%
height = 28pt
offset-x = 1%
offset-y = 5px
radius = 10

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt

border-size = 0pt
border-color = #1E2235

; Ujung kiri & kanan bar rapat ke tombol
padding-left = 0
padding-right = 0

; DIBUAT 0 AGAR JARAK ANTAR MODUL RAPAT (HANYA MENGANDALKAN SEPARATOR 1 SPASI)
module-margin = 0

separator = " "

font-0 = "JetBrains Mono:pixelsize=9;3"
font-1 = "Font Awesome 6 Free Solid:pixelsize=9;3"

; Tambahkan font khusus icon besar di sini:
font-2 = "Font Awesome 6 Free Solid:pixelsize=14;3"

modules-left = launcher bspwm aimp xwindow
modules-right = cpu memory pulseaudio mic battery systray network mprisence date powermenu

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true
wm-restack = bspwm
override-redirect = true

; ==========================================================
; TOMBOL KIRI (MEPET KE UJUNG KIRI & RAPAT KE BSPWM)
; ==========================================================
[module/launcher]
type = custom/text
format = ""
format-font = 3
format-background = ${colors.teal}
format-foreground = ${colors.foreground}
format-padding = 2
click-left = "rofi -show drun -theme-str 'inputbar { children: [ icon-search, entry ]; }' > /dev/null 2>&1 &"

; ==========================================================
; WORKSPACE BSPWM
; ==========================================================
[module/bspwm]
type = internal/bspwm

# Workspace yang sedang diakses (Aktif / Focused)
label-focused = 
label-focused-background = ${colors.background-alt}
label-focused-foreground = ${colors.teal}
label-focused-underline = ${colors.teal}
label-focused-padding = 1

# Workspace yang tidak diakses tapi ada isinya (Occupied)
label-occupied = ●
label-occupied-foreground = ${colors.foreground}
label-occupied-padding = 1

# Workspace yang kosong (Empty)
#label-empty = ◆
label-empty = •
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

; ==========================================================
; JUDUL APLIKASI
; ==========================================================
[module/xwindow]
type = internal/xwindow
label = %title:0:30:...%
label-foreground = ${colors.foreground-alt}
label-padding = 1

; ==========================================================
; MONITOR SYSTEM (CPU & RAM)
; ==========================================================
[module/cpu]
type = internal/cpu
interval = 2

format-foreground = ${colors.fuchsia}
format = %{A1:~/.config/rofi/process-manager.sh:} <label>%{A}
label = %percentage:2%%
label-foreground = ${colors.foreground}


[module/memory]
type = internal/memory
interval = 2

format-foreground = ${colors.teal}
format = %{A1:~/.config/rofi/process-manager.sh:} <label>%{A}
label = %percentage_used:2%%
label-foreground = ${colors.foreground}

; ==========================================================
; AUDIO: SPEAKER (HANYA IKON SAAT MUTE)
; ==========================================================
[module/pulseaudio]
type = internal/pulseaudio

use-ui-max = false

;format-volume = %{A1:~/.config/bspwm/scripts/pavucontrol.sh speaker:}<ramp-volume> <label-volume>%{A}
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-foreground = ${colors.teal}

format-muted = <label-muted>
label-muted = ""
label-muted-foreground = ${colors.fuchsia}

;click-left = pavucontrol
click-left = pactl set-sink-mute @DEFAULT_SINK@ toggle
click-right = ~/.config/bspwm/scripts/pavucontrol.sh speaker

; ==========================================================
; AUDIO: MICROPHONE
; ==========================================================
[module/mic]
type = custom/script

exec = sh -c 'if pactl get-source-mute @DEFAULT_SOURCE@ | grep -q "yes"; then echo "%{F#D946EF}%{F-}"; else vol=$(pactl get-source-volume @DEFAULT_SOURCE@ | grep -o "[0-9]*%" | head -n 1); echo "%{F#D946EF}%{F-} $vol"; fi'
interval = 1

format = <label>
label = %output%
label-foreground = ${colors.foreground}

scroll-up = sh -c 'pactl set-source-volume @DEFAULT_SOURCE@ +5%; v=$(pactl get-source-volume @DEFAULT_SOURCE@ | grep -o "[0-9]*%" | head -n 1 | tr -d "%"); [ "$v" -gt 100 ] && pactl set-source-volume @DEFAULT_SOURCE@ 100%'
scroll-down = pactl set-source-volume @DEFAULT_SOURCE@ -5%

click-left = pactl set-source-mute @DEFAULT_SOURCE@ toggle
click-right = ~/.config/bspwm/scripts/pavucontrol.sh mic

; ==========================================================
; WLAN (Dynamic Interface, Gradient Fuchsia -> Teal, Clickable)
; ==========================================================
[module/wlan]
type = internal/network

; 1. Otomatis deteksi interface Wi-Fi
interface-type = wireless
interval = 3.0

; 2. Saat Connected (Bisa diklik & path disamakan)
; Hapus tanda kutip luar agar action tag diparsing dengan benar
format-connected = %{A1:~/.config/rofi/wifi.sh &:} <ramp-signal>%{A}
label-connected =

; 3. Saat Disconnected (Hanya Icon saja & Bisa diklik)
format-disconnected = %{A1:~/.config/rofi/wifi.sh &:} <label-disconnected> %{A}
label-disconnected = %{F#d946ef}%{F-}

; 4. Gradient Warna Icon (0 = Lemah / Fuchsia  ==>  4 = Penuh / Teal)
; Fuchsia: #d946ef | Teal: #14b8a6
ramp-signal-0 = %{F#d946ef}%{F-}
ramp-signal-1 = %{F#e879f9}%{F-}
ramp-signal-2 = %{F#818cf8}%{F-}
ramp-signal-3 = %{F#2dd4bf}%{F-}
ramp-signal-4 = %{F#14b8a6}%{F-}

; ==========================================================
; NETWORK STATS
; ==========================================================
[module/network]
type = internal/network
interface = wlan0
interval = 1.0

; Bungkus label dengan Action Tag %{A1:skrip:} ... %{A}
label-connected = "%{A1:~/.config/rofi/vnstat.sh:}%{F#008080}%downspeed:7% %{F#D946EF}%upspeed:7%%{A}"
label-connected-foreground = ${colors.foreground}
format-disconnected =

; ==========================================================
; JAM & TANGGAL
; ==========================================================
[module/date]
type = internal/date
interval = 1

; Tampilan biasa (hanya jam)
date = %H:%M

; Tampilan saat diklik kiri (alt)
date-alt = %a, %d %b %Y - %H:%M

; Gunakan tag %{A3:...} untuk klik kanan
label = "%{A3:~/.config/bspwm/scripts/gsimplecal.sh:}%date% %{A}"
label-foreground = ${colors.foreground}

; ==========================================================
; BATTERAY & AC
; ==========================================================
[module/batteryscript]
type = custom/script
exec = ~/.config/polybar/scripts/battery.sh
interval = 5

[module/battery]
type = internal/battery
# Turunkan interval agar Polybar lebih cepat mengecek saat casan dicabut
poll-interval = 2 

# SANGAT PENTING: Pastikan ini sesuai dengan ls -1 /sys/class/power_supply/
# Biasanya adapter itu ACAD, AC0, atau ADP1. Jika salah, Polybar tidak tahu kapan kabel dicabut!
battery = BAT0
adapter = AC 

# Saya sarankan full-at dinaikkan ke 98. 
# Jika diset 90, saat baterai turun dari 100% ke 91%, dia akan tetap dianggap "FULL" dan tidak menampilkan discharging.
full-at = 98 
low-at = 20

# STATUS AC / FULL / NOT CHARGING
format-full = <label-full>
format-full-prefix = ""
format-full-prefix-foreground = ${colors.teal}
label-full = "AC %percentage%%"
label-full-foreground = ${colors.foreground}

# STATUS CHARGING (Dengan Animasi)
format-charging = <animation-charging> <label-charging>
label-charging = "%percentage%%"
label-charging-foreground = ${colors.foreground}

animation-charging-0 = ""
animation-charging-1 = ""
animation-charging-2 = ""
animation-charging-3 = ""
animation-charging-4 = ""
animation-charging-foreground = ${colors.teal}
animation-charging-framerate = 750

# STATUS DISCHARGING (Kabel Charger Dicabut)
format-discharging = <ramp-capacity> <label-discharging>
label-discharging = %percentage%%
label-discharging-foreground = ${colors.foreground}

ramp-capacity-0 = ""
ramp-capacity-1 = ""
ramp-capacity-2 = ""
ramp-capacity-3 = ""
ramp-capacity-4 = ""
ramp-capacity-foreground = ${colors.fuchsia}

# STATUS LOW (Kedip Peringatan)
format-low = <animation-low> <label-low>
label-low = "%percentage%%!"
label-low-foreground = ${colors.foreground}

animation-low-0 = ""
animation-low-1 = ""
animation-low-foreground = ${colors.fuchsia}
animation-low-framerate = 400

# ----- TAMBAHAN BARU UNTUK BATERAI SOAK -----
# Status UNKNOWN muncul jika baterai soak gagal melaporkan apakah dia sedang cas/tidak
format-unknown = <label-unknown>
format-unknown-prefix = ""
format-unknown-prefix-foreground = ${colors.fuchsia}
label-unknown = "%percentage%%"
label-unknown-foreground = ${colors.foreground}

; ==========================================================
; SYSTEM TRAY
; ==========================================================
[module/systray]
type = internal/tray
format-margin = 0px
tray-spacing = 4px
tray-size = 50%

; ==========================================================
; TOMBOL KANAN (MEPET KE UJUNG KANAN & RAPAT KE DATE)
; ==========================================================
[module/powermenu]
type = custom/text
format = ""
format-font = 3
format-background = ${colors.fuchsia}
format-foreground = ${colors.foreground}
format-padding = 2
click-left = ~/.config/rofi/powermenu.sh

; ==========================================================
; MPRISENCE
; ==========================================================
[module/mprisence]
type = custom/script
exec = ~/.config/mprisence/mprisence.sh
interval = 2
click-left = ~/.config/mprisence/mprisence.sh --toggle
click-right = notify-send -r 9991 -t 2000 -u low -i multimedia-audio-player "MPRISence" "Click to open Aimp"
cursor-click = pointer

; ==========================================================
; AIMP Player
; ==========================================================
[module/aimp]
type = custom/script
exec = ~/.config/polybar/scripts/aimp.sh
interval = 1

format = <label>
format-background = ${colors.background-alt}
format-padding = 2

; Klik kanan membuka AIMP player
click-right = aimp &


[settings]
screenchange-reload = true
pseudo-transparency = false