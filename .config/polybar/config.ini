;==========================================================
;   POLYBAR - TEAL & FUCHSIA FLOATING THEME
;==========================================================

[colors]
background = #0F111A
background-alt = #1A1D2D
foreground = #E2E8F0
foreground-alt = #94A3B8

; Palet Teal & Fuchsia
teal = #008080
fuchsia = #D946EF
purple = #A855F7
disabled = #475569

[bar/example]
bottom = true

; Ukuran dan jarak mengambang (Floating margin)
width = 98%
height = 28pt
offset-x = 1%
offset-y = 5px
radius = 10

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt

border-size = 0pt
border-color = #1E2235

; DIUBAH KE 0 AGAR TOMBOL MEPET KE UJUNG KIRI & KANAN
padding-left = 0
padding-right = 0
module-margin = 1

separator = " "

font-0 = "JetBrains Mono:size=10;3"
font-1 = "Font Awesome 6 Free Solid:pixelsize=11;3"
font-2 = "Font Awesome 6 Brands:pixelsize=11;3"

modules-left = launcher bspwm xwindow
modules-right = cpu memory pulseaudio date systray network powermenu

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true
wm-restack = bspwm

; ==========================================================
; TOMBOL KIRI (MEPET KE UJUNG KIRI BAR)
; ==========================================================
[module/launcher]
type = custom/text
format = "  "
format-background = ${colors.teal}
format-foreground = ${colors.foreground}
format-padding = 2
click-left = rofi -show drun -show-icons

; ==========================================================
; WORKSPACE BSPWM
; ==========================================================
[module/bspwm]
type = internal/bspwm

label-focused = %name%
label-focused-background = ${colors.background-alt}
label-focused-foreground = ${colors.teal}
label-focused-underline = ${colors.teal}
label-focused-padding = 2

label-occupied = %name%
label-occupied-foreground = ${colors.foreground}
label-occupied-padding = 2

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 2

; ==========================================================
; JUDUL APLIKASI
; ==========================================================
[module/xwindow]
type = internal/xwindow
label = %title:0:35:...%
label-foreground = ${colors.foreground-alt}
label-padding = 1

; ==========================================================
; MONITOR SYSTEM (CPU & RAM)
; ==========================================================
[module/cpu]
type = internal/cpu
interval = 2
format = <label>
format-prefix = " "
format-prefix-foreground = ${colors.fuchsia}
label = %percentage:2%%
label-foreground = ${colors.foreground}

[module/memory]
type = internal/memory
interval = 2
format = <label>
format-prefix = " "
format-prefix-foreground = ${colors.teal}
label = %percentage_used:2%%
label-foreground = ${colors.foreground}

; ==========================================================
; AUDIO
; ==========================================================
[module/pulseaudio]
type = internal/pulseaudio

format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-foreground = ${colors.teal}

format-muted-prefix = " "
format-muted-prefix-foreground = ${colors.fuchsia}
label-muted = Mute
label-muted-foreground = ${colors.disabled}

click-left = pavucontrol
click-right = pactl set-sink-mute @DEFAULT_SINK@ toggle
scroll-up = pactl set-sink-volume @DEFAULT_SINK@ +5%
scroll-down = pactl set-sink-volume @DEFAULT_SINK@ -5%

; ==========================================================
; NETWORK STATS (Hanya tampil saat terkoneksi)
; ==========================================================
[module/network]
type = internal/network

; Ganti dengan nama interface laptop Anda dari Langkah 1
; Contoh: interface = wlan0 (atau wlp2s0)
interface = wlan0

; Jika menggunakan Polybar versi terbaru, Anda juga bisa memakai interface-type:
; interface-type = wireless

interval = 1.0

; Tampilan saat TERKONEKSI (Download Teal & Upload Fuchsia)
; format-connected = <label-connected>
; format-connected-prefix = " "
; format-connected-prefix-foreground = ${colors.teal}

; Catatan: Angka ':7%' berfungsi agar panjang teks stabil dan bar tidak goyang/berkedip saat kecepatan berubah
label-connected = " %{F#008080}%{F-} %downspeed:7% %{F#D946EF}%{F-} %upspeed:7%"
label-connected-foreground = ${colors.foreground}

; Dikosongkan agar OTOMATIS HILANG saat laptop tidak terkoneksi ke internet
format-disconnected =

; ==========================================================
; JAM & TANGGAL
; ==========================================================
[module/date]
type = internal/date
interval = 1
date = %H:%M
date-alt = %a, %d %b %H:%M

format-prefix = " "
format-prefix-foreground = ${colors.teal}
label = %date%

; ==========================================================
; SYSTEM TRAY
; ==========================================================
[module/systray]
type = internal/tray
format-margin = 2pt
tray-spacing = 6pt

; ==========================================================
; TOMBOL KANAN (MEPET KE UJUNG KANAN BAR)
; ==========================================================
[module/powermenu]
type = custom/text
format = "  "
format-background = ${colors.fuchsia}
format-foreground = #FFFFFF
format-padding = 2
click-left = ~/.config/rofi/powermenu.sh

[settings]
screenchange-reload = true
pseudo-transparency = true