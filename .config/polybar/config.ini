;==========================================================
;   POLYBAR - TEAL & FUCHSIA FLOATING THEME
;==========================================================

[colors]
background = #0F111A
background-alt = #1A1D2D
foreground = #FFFFFF
foreground-alt = #94A3B8

; Palet Teal & Fuchsia
teal = #008080
fuchsia = #D946EF
purple = #A855F7
disabled = #475569

[bar/main]
bottom = true

; Ukuran dan jarak mengambang (Floating margin)
width = 98%
height = 28pt
offset-x = 1%
offset-y = 5px
radius = 10

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt

border-size = 0pt
border-color = #1E2235

; DIUBAH KE 0 AGAR TOMBOL MEPET KE UJUNG KIRI & KANAN
padding-left = 0
padding-right = 0
module-margin = 1

separator = " "

font-0 = "JetBrains Mono:size=10;3"
font-1 = "Font Awesome 6 Free Solid:pixelsize=11;3"
font-2 = "Font Awesome 6 Brands:pixelsize=11;3"

modules-left = launcher bspwm xwindow
modules-right = cpu memory pulseaudio mic systray network mprisence date powermenu

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true
wm-restack = bspwm

; ==========================================================
; TOMBOL KIRI (MEPET KE UJUNG KIRI BAR)
; ==========================================================
[module/launcher]
type = custom/text
format = "  "
format-background = ${colors.teal}
format-foreground = ${colors.foreground}
format-padding = 2
click-left = rofi -show drun -show-icons

; ==========================================================
; WORKSPACE BSPWM
; ==========================================================
[module/bspwm]
type = internal/bspwm

label-focused = %name%
label-focused-background = ${colors.background-alt}
label-focused-foreground = ${colors.teal}
label-focused-underline = ${colors.teal}
label-focused-padding = 2

label-occupied = %name%
label-occupied-foreground = ${colors.foreground}
label-occupied-padding = 2

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 2

; ==========================================================
; JUDUL APLIKASI
; ==========================================================
[module/xwindow]
type = internal/xwindow
label = %title:0:35:...%
label-foreground = ${colors.foreground-alt}
label-padding = 1

; ==========================================================
; MONITOR SYSTEM (CPU & RAM)
; ==========================================================
[module/cpu]
type = internal/cpu
interval = 2
format = <label>
format-prefix = " "
format-prefix-foreground = ${colors.fuchsia}
label = %percentage:2%%
label-foreground = ${colors.foreground}

[module/memory]
type = internal/memory
interval = 2
format = <label>
format-prefix = " "
format-prefix-foreground = ${colors.teal}
label = %percentage_used:2%%
label-foreground = ${colors.foreground}

; ==========================================================
; AUDIO: SPEAKER (HANYA IKON SAAT MUTE)
; ==========================================================
[module/pulseaudio]
type = internal/pulseaudio

; Kunci volume maksimal 100%
use-ui-max = false

; Tampilan saat bersuara (Normal)
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-foreground = ${colors.teal}

; Tampilan saat MUTE (Hanya memunculkan ikon silang tanpa teks "Mute")
format-muted = <label-muted>
label-muted = ""
label-muted-foreground = ${colors.fuchsia}

click-left = pavucontrol
click-right = pactl set-sink-mute @DEFAULT_SINK@ toggle


; ==========================================================
; AUDIO: MICROPHONE (IKON BERUBAH DINAMIS SAAT MUTE)
; ==========================================================
[module/mic]
type = custom/script

; Cek status mute pactl: jika mute tampilkan ikon , jika aktif tampilkan ikon  + volume
exec = sh -c 'if pactl get-source-mute @DEFAULT_SOURCE@ | grep -q "yes"; then echo "%{F#D946EF}%{F-}"; else vol=$(pactl get-source-volume @DEFAULT_SOURCE@ | grep -o "[0-9]*%" | head -n 1); echo "%{F#D946EF}%{F-} $vol"; fi'
interval = 1

format = <label>
label = %output%
label-foreground = ${colors.foreground}

; Scroll UP (Batas 100%) & Scroll DOWN
scroll-up = sh -c 'pactl set-source-volume @DEFAULT_SOURCE@ +5%; v=$(pactl get-source-volume @DEFAULT_SOURCE@ | grep -o "[0-9]*%" | head -n 1 | tr -d "%"); [ "$v" -gt 100 ] && pactl set-source-volume @DEFAULT_SOURCE@ 100%'
scroll-down = pactl set-source-volume @DEFAULT_SOURCE@ -5%

; Klik Kiri: Mute/Unmute Mic
click-left = pactl set-source-mute @DEFAULT_SOURCE@ toggle

; Klik Kanan: Buka Pavucontrol
click-right = pavucontrol

; ==========================================================
; NETWORK STATS (Hanya tampil saat terkoneksi)
; ==========================================================
[module/network]
type = internal/network

; Ganti dengan nama interface laptop Anda dari Langkah 1
; Contoh: interface = wlan0 (atau wlp2s0)
interface = wlan0

; Jika menggunakan Polybar versi terbaru, Anda juga bisa memakai interface-type:
; interface-type = wireless

interval = 1.0

; Tampilan saat TERKONEKSI (Download Teal & Upload Fuchsia)
; format-connected = <label-connected>
; format-connected-prefix = " "
; format-connected-prefix-foreground = ${colors.teal}

; Catatan: Angka ':7%' berfungsi agar panjang teks stabil dan bar tidak goyang/berkedip saat kecepatan berubah
; label-connected = " %{F#008080}%{F-} %downspeed:7% %{F#D946EF}%{F-} %upspeed:7%"
label-connected = " %{F#008080} %downspeed:7% %{F#D946EF} %upspeed:7%"
label-connected-foreground = ${colors.foreground}

; Dikosongkan agar OTOMATIS HILANG saat laptop tidak terkoneksi ke internet
format-disconnected =

; ==========================================================
; JAM & TANGGAL
; ==========================================================
[module/date]
type = internal/date
interval = 1
date = %H:%M
date-alt = %a, %d %b %H:%M

; format-prefix = " "
label = %date%
label-foreground = ${colors.foreground}

; ==========================================================
; SYSTEM TRAY
; ==========================================================
[module/systray]
type = internal/tray
format-margin = 2pt
tray-spacing = 6pt

; ==========================================================
; TOMBOL KANAN (MEPET KE UJUNG KANAN BAR)
; ==========================================================
[module/powermenu]
type = custom/text
format = "  "
format-background = ${colors.fuchsia}
format-foreground = ${colors.foreground}
format-padding = 2
click-left = ~/.config/rofi/powermenu.sh

; ==========================================================
; MPRISENCE
; ==========================================================
[module/mprisence]
type = custom/script

; Eksekusi script tanpa argumen untuk menampilkan ikon status
exec = ~/.config/mprisence/mprisence.sh

; Interval refresh (dalam detik)
interval = 2

; Tambahkan argumen --toggle untuk aksi klik
click-left = ~/.config/mprisence/mprisence.sh --toggle

; (Opsional) Mengubah cursor menjadi pointer saat diarahkan ke modul
cursor-click = pointer

[settings]
screenchange-reload = true
pseudo-transparency = true